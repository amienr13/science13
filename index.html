<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat dengan Claude</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e4e4e7;
    --text: #1a1a1a;
    --text-dim: #6b7280;
    --accent: #c15f3c;
    --accent-dim: #e8ddd4;
    --bubble-user: #c15f3c;
    --bubble-user-text: #ffffff;
    --bubble-ai: #ffffff;
    --danger: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1f;
      --panel: #2a2a2c;
      --border: #3c3c3e;
      --text: #ececec;
      --text-dim: #9a9a9d;
      --accent: #d97757;
      --accent-dim: #4a3730;
      --bubble-user: #d97757;
      --bubble-user-text: #1a1008;
      --bubble-ai: #2a2a2c;
      --danger: #e86a6a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 760px; margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px; font-weight: 600; margin: 0;
  }
  header h1 span { color: var(--accent); }
  #settingsBtn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; padding: 6px 10px; border-radius: 8px; font-size: 14px;
  }
  #settingsBtn:hover { background: var(--border); color: var(--text); }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.5; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bubble-ai); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.system .bubble { background: transparent; border: 1px dashed var(--border); color: var(--text-dim); font-size: 13px; }

  #empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-dim); text-align: center; padding: 24px; gap: 8px;
  }
  #empty .big { font-size: 20px; font-weight: 600; color: var(--text); }

  form#composer {
    display: flex; gap: 8px; padding: 12px 16px 16px;
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  #input {
    flex: 1; resize: none; max-height: 160px; min-height: 44px;
    border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px;
    background: var(--panel); color: var(--text); font-size: 14.5px; font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    width: 44px; height: 44px; cursor: pointer; flex-shrink: 0; font-size: 18px;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  #overlay.show { display: flex; }
  #settingsPanel {
    background: var(--panel); border-radius: 16px; padding: 22px;
    width: 100%; max-width: 420px; border: 1px solid var(--border);
  }
  #settingsPanel h2 { margin: 0 0 14px; font-size: 16px; }
  #settingsPanel label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  #settingsPanel input, #settingsPanel select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  #settingsPanel .hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }
  #settingsPanel .actions { display: flex; gap: 8px; margin-top: 20px; }
  #settingsPanel button {
    flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  #saveSettings { background: var(--accent); color: #fff; }
  #closeSettings { background: var(--border); color: var(--text); }
  #clearKey { background: transparent; color: var(--danger); border: 1px solid var(--danger); flex: initial; }

  #errorBanner {
    display: none; background: var(--danger); color: #fff; font-size: 13px;
    padding: 10px 16px; text-align: center;
  }
  #errorBanner.show { display: block; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Chat dengan <span>Claude</span></h1>
    <button id="settingsBtn" title="Pengaturan">⚙︎ Pengaturan</button>
  </header>

  <div id="errorBanner"></div>

  <div id="empty">
    <div class="big">Mulai percakapan</div>
    <div>Masukkan API key Claude Anda di Pengaturan untuk memulai.</div>
  </div>

  <div id="messages" style="display:none;"></div>

  <form id="composer">
    <textarea id="input" placeholder="Tulis pesan..." rows="1"></textarea>
    <button id="sendBtn" type="submit">➤</button>
  </form>
</div>

<div id="overlay">
  <div id="settingsPanel">
    <h2>Pengaturan</h2>

    <label for="apiKey">Claude API Key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-...">
    <div class="hint">
      Key disimpan <strong>hanya di browser Anda</strong> (localStorage), tidak pernah dikirim ke mana pun selain api.anthropic.com. Dapatkan key di console.anthropic.com.
    </div>

    <label for="model">Model</label>
    <select id="model">
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
      <option value="claude-opus-5-5">Claude Opus 5.5</option>
      <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
      <option value="claude-fable-5-1">Claude Fable 5.1</option>
    </select>

    <label for="systemPrompt">System prompt (opsional)</label>
    <input id="systemPrompt" type="text" placeholder="Contoh: Jawab selalu dalam Bahasa Indonesia.">

    <div class="actions">
      <button id="closeSettings" type="button">Tutup</button>
      <button id="saveSettings" type="button">Simpan</button>
    </div>
    <div class="actions">
      <button id="clearKey" type="button">Hapus key &amp; riwayat</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "claude_chat_api_key";
  var STORAGE_MODEL = "claude_chat_model";
  var STORAGE_SYSTEM = "claude_chat_system";
  var API_URL = "https://api.anthropic.com/v1/messages";

  var messages = [];
  var history = [];

  var $messages = document.getElementById("messages");
  var $empty = document.getElementById("empty");
  var $composer = document.getElementById("composer");
  var $input = document.getElementById("input");
  var $sendBtn = document.getElementById("sendBtn");
  var $errorBanner = document.getElementById("errorBanner");

  var $overlay = document.getElementById("overlay");
  var $settingsBtn = document.getElementById("settingsBtn");
  var $closeSettings = document.getElementById("closeSettings");
  var $saveSettings = document.getElementById("saveSettings");
  var $clearKey = document.getElementById("clearKey");
  var $apiKey = document.getElementById("apiKey");
  var $model = document.getElementById("model");
  var $systemPrompt = document.getElementById("systemPrompt");

  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }
  function safeRemove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  function loadSettings() {
    $apiKey.value = safeGet(STORAGE_KEY) || "";
    $model.value = safeGet(STORAGE_MODEL) || "claude-sonnet-5-5";
    $systemPrompt.value = safeGet(STORAGE_SYSTEM) || "";
  }

  function openSettings() { $overlay.classList.add("show"); }
  function closeSettings() { $overlay.classList.remove("show"); }

  $settingsBtn.addEventListener("click", openSettings);
  $closeSettings.addEventListener("click", closeSettings);
  $overlay.addEventListener("click", function (e) {
    if (e.target === $overlay) closeSettings();
  });

  $saveSettings.addEventListener("click", function () {
    safeSet(STORAGE_KEY, $apiKey.value.trim());
    safeSet(STORAGE_MODEL, $model.value);
    safeSet(STORAGE_SYSTEM, $systemPrompt.value);
    closeSettings();
    hideError();
  });

  $clearKey.addEventListener("click", function () {
    if (!confirm("Hapus API key dan seluruh riwayat chat di perangkat ini?")) return;
    safeRemove(STORAGE_KEY);
    safeRemove(STORAGE_MODEL);
    safeRemove(STORAGE_SYSTEM);
    history = [];
    renderMessages();
    loadSettings();
    closeSettings();
  });

  function showError(msg) {
    $errorBanner.textContent = msg;
    $errorBanner.classList.add("show");
  }
  function hideError() {
    $errorBanner.classList.remove("show");
  }

  function renderMessages() {
    if (history.length === 0) {
      $empty.style.display = "flex";
      $messages.style.display = "none";
      return;
    }
    $empty.style.display = "none";
    $messages.style.display = "flex";
    $messages.innerHTML = "";
    history.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "msg " + m.role;
      var bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = m.content;
      row.appendChild(bubble);
      $messages.appendChild(row);
    });
    $messages.scrollTop = $messages.scrollHeight;
  }

  function addMessage(role, content) {
    history.push({ role: role, content: content });
    renderMessages();
    return history[history.length - 1];
  }

  function autoGrow() {
    $input.style.height = "auto";
    $input.style.height = Math.min($input.scrollHeight, 160) + "px";
  }
  $input.addEventListener("input", autoGrow);
  $input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      $composer.requestSubmit();
    }
  });

  $composer.addEventListener("submit", async function (e) {
    e.preventDefault();
    hideError();

    var apiKey = safeGet(STORAGE_KEY);
    if (!apiKey) {
      showError("Masukkan API key Claude Anda di Pengaturan terlebih dahulu.");
      openSettings();
      return;
    }

    var text = $input.value.trim();
    if (!text) return;

    $input.value = "";
    autoGrow();
    addMessage("user", text);

    $sendBtn.disabled = true;

    var assistantEntry = addMessage("assistant", "");
    var bubbleEl = $messages.lastElementChild.querySelector(".bubble");
    bubbleEl.innerHTML = '<span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';

    var model = safeGet(STORAGE_MODEL) || "claude-sonnet-5-5";
    var system = safeGet(STORAGE_SYSTEM) || "";

    var apiMessages = history
      .filter(function (m) { return m.role === "user" || m.role === "assistant"; })
      .slice(0, -1)
      .map(function (m) { return { role: m.role, content: m.content }; });
    apiMessages.push({ role: "user", content: text });

    var body = {
      model: model,
      max_tokens: 4096,
      messages: apiMessages,
      stream: true
    };
    if (system) body.system = system;

    try {
      var resp = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify(body)
      });

      if (!resp.ok) {
        var errData = null;
        try { errData = await resp.json(); } catch (e) {}
        var msg = (errData && errData.error && errData.error.message) || ("HTTP " + resp.status);
        throw new Error(msg);
      }

      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      var full = "";
      var first = true;

      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (line.indexOf("data: ") !== 0) continue;
          var payload = line.slice(6);
          if (payload === "[DONE]") continue;
          var evt;
          try { evt = JSON.parse(payload); } catch (e) { continue; }
          if (evt.type === "content_block_delta" && evt.delta && evt.delta.type === "text_delta") {
            if (first) { bubbleEl.textContent = ""; first = false; }
            full += evt.delta.text;
            bubbleEl.textContent = full;
            $messages.scrollTop = $messages.scrollHeight;
          } else if (evt.type === "error") {
            throw new Error((evt.error && evt.error.message) || "Streaming error");
          }
        }
      }

      assistantEntry.content = full || "(tidak ada respons)";
      if (!full) bubbleEl.textContent = assistantEntry.content;

    } catch (err) {
      history.pop();
      renderMessages();
      showError("Gagal: " + err.message);
    } finally {
      $sendBtn.disabled = false;
      $input.focus();
    }
  });

  loadSettings();
  renderMessages();
})();
</script>
</body>
</html>
